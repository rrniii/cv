project:
  type: default
  output-dir: _build
  render:
    - cv.qmd
    - cv-1p.qmd
    - cv-2p.qmd
    - cv-3p.qmd
    - publications.qmd
  pre-render:
    - "python3 scripts/build_sections.py"
    - "python3 scripts/update_metrics.py"
    - "python3 scripts/render_publications_web.py"
  post-render:
    - "python3 scripts/clean_artifacts.py"

execute:
  enabled: false

filters:
  - filters/cv_templates.lua

author: "Ryan R. Neely III"
pagetitle: "Ryan R. Neely III — Curriculum vitae"
cv:
  role: "Professor of Atmospheric Physics"
  email: "R.Neely@leeds.ac.uk"
  website: "https://environment.leeds.ac.uk/see/staff/1447/dr-ryan-neely-iii"
  website-label: "University profile"
  orcid: "0000-0003-4560-4812"
  scholar: "zK6Ngs0AAAAJ"
  github: "rrniii"
  address:
    - "School of Earth, Environment and Sustainability"
    - "University of Leeds"
    - "National Centre for Atmospheric Science"
    - "Leeds, United Kingdom"

format:
  pdf:
    documentclass: curve
    fontsize: 11pt
    classoption:
      - a4paper
      - skipsamekey
      - english
    pdf-engine: lualatex
    latex-max-runs: 4
    cite-method: biblatex
    include-in-header: preamble.tex
    geometry:
      - a4paper
      - margin=0.75in
  html:
    theme: none
    css: styles/cv-web.scss
    toc: false
    toc-depth: 2
    toc-location: left
    number-sections: false
    embed-resources: true
    smooth-scroll: true
    html-math-method: mathjax
    include-in-header:
      text: |
        <meta name="color-scheme" content="light">
        <meta name="robots" content="noindex, nofollow, noarchive">
        <script defer src="styles/cv-web.js"></script>
