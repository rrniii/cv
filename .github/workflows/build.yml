name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
          tinytex: true

      - name: Cache TinyTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-2026-repo-v2-${{ hashFiles('**/*.sty', '**/*.qmd', '_quarto.yml') }}
          restore-keys: tinytex-2026-repo-v2-

      - name: Install LaTeX packages
        run: |
          export PATH="$HOME/.TinyTeX/bin/$(uname -m)-linux:$PATH"
          tex_root="$(kpsewhich -var-value=TEXMFROOT)"
          repository="$(python3 scripts/select_texlive_repository.py "$tex_root")"
          tlmgr option repository "$repository"
          tlmgr update --self --all
          tlmgr install curve cochineal cabin inconsolata fontawesome5 simpleicons \
            fontspec luaotfload unicode-math lualatex-math lm-math \
            biblatex-phys biber silence relsize fancyhdr lastpage \
            csquotes xpatch comment multirow pgf etoolbox microtype \
            caption float bookmark xurl footnotehyper booktabs iftex parskip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python3 -m compileall -q scripts

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build PDF and HTML variants
        id: render
        run: make all

      - name: Verify short CV page counts
        run: |
          mismatched=0
          for pages in 1 2 3; do
            actual="$(pdfinfo "_build/cv-${pages}p.pdf" | awk '/^Pages:/ {print $2}')"
            if [ "$actual" -ne "$pages" ]; then
              echo "::error::cv-${pages}p.pdf has ${actual} pages; expected ${pages}."
              mismatched=1
            fi
          done
          exit "$mismatched"

      - name: Upload build for download and review
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cv-build
          path: _build/
          retention-days: 14

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: '**/*.log'
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: cv-build
          path: _build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publish PDFs as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Curriculum vitae
          body: "Built from commit ${{ github.sha }}"
          files: |
            _build/cv.pdf
            _build/cv-3p.pdf
            _build/cv-2p.pdf
            _build/cv-1p.pdf
            _build/publications.pdf
